# Example values for CI/CD automated validation
# Usage: helm install ci-test ./helm/test-app -f values-ci-validation.yaml

image:
  repository: my-business-app
  tag: latest
  pullPolicy: Always  # Always pull for CI

mode: trouble

dbaas:
  # Use existing secret in CI environment
  existingSecret: "ci-dbaas-credentials"

trouble:
  # Quick validation scenario
  scenarios:
    - slow-queries

  intensity: low       # Low intensity for CI
  duration: 300        # 5 minutes only
  rampUp: 0
  cleanupOnExit: true

  controlApi:
    enabled: false     # No API needed for CI

# Minimal resources for CI
troubleResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
