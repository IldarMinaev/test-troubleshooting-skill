# Example values for compound issue demo
# Usage: helm install trouble-compound ./helm/test-app -f values-trouble-compound.yaml

image:
  repository: my-business-app
  tag: latest
  pullPolicy: IfNotPresent

mode: trouble

dbaas:
  url: "http://dbaas-aggregator:8080"
  user: "dba_client"
  password: "your-password-here"

trouble:
  # Multiple scenarios for common-troubleshooting skill testing
  scenarios:
    - slow-queries
    - pool-exhaustion
    - disk-fill

  intensity: medium
  duration: 3600  # 1 hour
  rampUp: 300     # 5 minute gradual start
  cleanupOnExit: true

  controlApi:
    enabled: true
    port: 8080

# Higher resources for compound scenarios
troubleResources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi

service:
  type: ClusterIP
  port: 8080
