# Example values file for trouble mode demos
# Usage: helm install trouble-demo ./helm/test-app -f values-trouble-demo.yaml

image:
  repository: my-business-app
  tag: latest
  pullPolicy: IfNotPresent

# Enable trouble mode
mode: trouble

dbaas:
  # Replace with your DBAAS configuration
  url: "http://dbaas-aggregator:8080"
  user: "dba_client"
  password: "your-password-here"
  # Or use existing secret:
  # existingSecret: "dbaas-credentials"

trouble:
  # Single scenario for quick demo
  scenarios:
    - slow-queries

  intensity: high
  duration: 1800  # 30 minutes
  rampUp: 0
  cleanupOnExit: true

  controlApi:
    enabled: true
    port: 8080

# Use higher resources for trouble mode
troubleResources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

service:
  type: ClusterIP
  port: 8080
