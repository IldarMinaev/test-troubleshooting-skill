apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-business-app.fullname" . }}
  labels:
    {{- include "my-business-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "my-business-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
      labels:
        {{- include "my-business-app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "my-business-app.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ if eq .Values.mode "trouble" }}trouble-generator{{ else }}load-generator{{ end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Common configuration
            {{- if .Values.dbaas.existingSecret }}
            - name: DBAAS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbaas.existingSecret }}
                  key: DBAAS_URL
            - name: DBAAS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbaas.existingSecret }}
                  key: DBAAS_USER
            - name: DBAAS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbaas.existingSecret }}
                  key: DBAAS_PASSWORD
            {{- else }}
            - name: DBAAS_URL
              value: {{ .Values.dbaas.url | quote }}
            - name: DBAAS_USER
              value: {{ .Values.dbaas.user | quote }}
            - name: DBAAS_PASSWORD
              value: {{ .Values.dbaas.password | quote }}
            {{- end }}
            - name: APP_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: MODE
              value: {{ .Values.mode | quote }}

            {{- if eq .Values.mode "workload" }}
            # Workload mode configuration
            - name: WORKER_COUNT
              value: {{ .Values.workers.count | quote }}
            - name: INSERT_RATE_MB_PER_HOUR
              value: {{ .Values.workers.insertRateMbPerHour | quote }}
            - name: WORKLOAD_MIX
              value: {{ .Values.workers.workloadMix | quote }}
            - name: LONG_QUERY_DURATION_SECONDS
              value: {{ .Values.workers.longQueryDurationSeconds | quote }}
            - name: DEADLOCK_INTERVAL_SECONDS
              value: {{ .Values.workers.deadlockIntervalSeconds | quote }}
            {{- else if eq .Values.mode "trouble" }}
            # Trouble mode configuration
            - name: TROUBLE_SCENARIOS
              value: {{ if .Values.trouble.scenariosString }}{{ .Values.trouble.scenariosString | quote }}{{ else }}{{ join "," .Values.trouble.scenarios | quote }}{{ end }}
            - name: TROUBLE_INTENSITY
              value: {{ .Values.trouble.intensity | quote }}
            - name: TROUBLE_DURATION
              value: {{ .Values.trouble.duration | quote }}
            - name: TROUBLE_RAMP_UP
              value: {{ .Values.trouble.rampUp | quote }}
            - name: CLEANUP_ON_EXIT
              value: {{ .Values.trouble.cleanupOnExit | quote }}
            - name: CONTROL_API_ENABLED
              value: {{ .Values.trouble.controlApi.enabled | quote }}
            {{- end }}
          {{- if and (eq .Values.mode "trouble") .Values.trouble.controlApi.enabled }}
          ports:
            - containerPort: {{ .Values.trouble.controlApi.port }}
              name: api
              protocol: TCP
          {{- end }}
          resources:
            {{- if eq .Values.mode "trouble" }}
            {{- toYaml .Values.troubleResources | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
