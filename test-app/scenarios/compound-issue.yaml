apiVersion: v1
kind: ConfigMap
metadata:
  name: trouble-compound-issue
data:
  MODE: "trouble"
  TROUBLE_SCENARIOS: "slow-queries,pool-exhaustion,disk-fill"
  TROUBLE_INTENSITY: "medium"
  TROUBLE_DURATION: "3600"  # 1 hour
  TROUBLE_RAMP_UP: "300"    # 5 minutes ramp-up
  CONTROL_API_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trouble-compound-issue
  labels:
    app: trouble-generator
    scenario: compound-issue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trouble-generator
      scenario: compound-issue
  template:
    metadata:
      labels:
        app: trouble-generator
        scenario: compound-issue
    spec:
      containers:
      - name: trouble-gen
        image: my-business-app:latest
        imagePullPolicy: IfNotPresent
        env:
        # DBAAS connection (replace with your values or use envFrom with existing secret)
        - name: DBAAS_URL
          value: "http://dbaas-aggregator:8080"
        - name: DBAAS_USER
          value: "dba_client"
        - name: DBAAS_PASSWORD
          value: "your-password-here"
        - name: APP_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Trouble configuration
        - name: MODE
          valueFrom:
            configMapKeyRef:
              name: trouble-compound-issue
              key: MODE
        - name: TROUBLE_SCENARIOS
          valueFrom:
            configMapKeyRef:
              name: trouble-compound-issue
              key: TROUBLE_SCENARIOS
        - name: TROUBLE_INTENSITY
          valueFrom:
            configMapKeyRef:
              name: trouble-compound-issue
              key: TROUBLE_INTENSITY
        - name: TROUBLE_DURATION
          valueFrom:
            configMapKeyRef:
              name: trouble-compound-issue
              key: TROUBLE_DURATION
        - name: TROUBLE_RAMP_UP
          valueFrom:
            configMapKeyRef:
              name: trouble-compound-issue
              key: TROUBLE_RAMP_UP
        - name: CONTROL_API_ENABLED
          valueFrom:
            configMapKeyRef:
              name: trouble-compound-issue
              key: CONTROL_API_ENABLED
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        ports:
        - containerPort: 8080
          name: api
---
apiVersion: v1
kind: Service
metadata:
  name: trouble-compound-issue
spec:
  selector:
    app: trouble-generator
    scenario: compound-issue
  ports:
  - port: 8080
    targetPort: 8080
    name: api
