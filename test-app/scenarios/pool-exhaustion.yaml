apiVersion: v1
kind: ConfigMap
metadata:
  name: trouble-pool-exhaustion
data:
  MODE: "trouble"
  TROUBLE_SCENARIOS: "pool-exhaustion"
  TROUBLE_INTENSITY: "high"
  TROUBLE_DURATION: "1800"  # 30 minutes
  CONTROL_API_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trouble-pool-exhaustion
  labels:
    app: trouble-generator
    scenario: pool-exhaustion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trouble-generator
      scenario: pool-exhaustion
  template:
    metadata:
      labels:
        app: trouble-generator
        scenario: pool-exhaustion
    spec:
      containers:
      - name: trouble-gen
        image: my-business-app:latest
        imagePullPolicy: IfNotPresent
        env:
        # DBAAS connection (replace with your values or use envFrom with existing secret)
        - name: DBAAS_URL
          value: "http://dbaas-aggregator:8080"
        - name: DBAAS_USER
          value: "dba_client"
        - name: DBAAS_PASSWORD
          value: "your-password-here"
        - name: APP_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Trouble configuration
        - name: MODE
          valueFrom:
            configMapKeyRef:
              name: trouble-pool-exhaustion
              key: MODE
        - name: TROUBLE_SCENARIOS
          valueFrom:
            configMapKeyRef:
              name: trouble-pool-exhaustion
              key: TROUBLE_SCENARIOS
        - name: TROUBLE_INTENSITY
          valueFrom:
            configMapKeyRef:
              name: trouble-pool-exhaustion
              key: TROUBLE_INTENSITY
        - name: TROUBLE_DURATION
          valueFrom:
            configMapKeyRef:
              name: trouble-pool-exhaustion
              key: TROUBLE_DURATION
        - name: CONTROL_API_ENABLED
          valueFrom:
            configMapKeyRef:
              name: trouble-pool-exhaustion
              key: CONTROL_API_ENABLED
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 8080
          name: api
---
apiVersion: v1
kind: Service
metadata:
  name: trouble-pool-exhaustion
spec:
  selector:
    app: trouble-generator
    scenario: pool-exhaustion
  ports:
  - port: 8080
    targetPort: 8080
    name: api
