apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-month-end
  labels:
    app: inventory-service
    scenario: month-end-processing
data:
  MODE: "batch"
  BATCH_JOBS: "report-generation,parallel-import,data-migration"
  PROCESSING_LOAD: "medium"
  JOB_DURATION: "3600"           # 1 hour
  WARMUP_PERIOD: "300"           # 5 minute gradual start
  GRACEFUL_SHUTDOWN: "true"
  MANAGEMENT_API_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-month-end
  labels:
    app: inventory-service
    scenario: month-end-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
      scenario: month-end-processing
  template:
    metadata:
      labels:
        app: inventory-service
        scenario: month-end-processing
    spec:
      containers:
      - name: batch-worker
        image: inventory-service:latest
        imagePullPolicy: IfNotPresent
        env:
        # DBAAS connection (replace with your values or use envFrom with existing secret)
        - name: DBAAS_URL
          value: "http://dbaas-aggregator:8080"
        - name: DBAAS_USER
          value: "dba_client"
        - name: DBAAS_PASSWORD
          value: "your-password-here"
        - name: APP_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Batch job configuration
        - name: MODE
          valueFrom:
            configMapKeyRef:
              name: inventory-month-end
              key: MODE
        - name: BATCH_JOBS
          valueFrom:
            configMapKeyRef:
              name: inventory-month-end
              key: BATCH_JOBS
        - name: PROCESSING_LOAD
          valueFrom:
            configMapKeyRef:
              name: inventory-month-end
              key: PROCESSING_LOAD
        - name: JOB_DURATION
          valueFrom:
            configMapKeyRef:
              name: inventory-month-end
              key: JOB_DURATION
        - name: WARMUP_PERIOD
          valueFrom:
            configMapKeyRef:
              name: inventory-month-end
              key: WARMUP_PERIOD
        - name: GRACEFUL_SHUTDOWN
          valueFrom:
            configMapKeyRef:
              name: inventory-month-end
              key: GRACEFUL_SHUTDOWN
        - name: MANAGEMENT_API_ENABLED
          valueFrom:
            configMapKeyRef:
              name: inventory-month-end
              key: MANAGEMENT_API_ENABLED
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        ports:
        - containerPort: 8080
          name: api
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-month-end
  labels:
    app: inventory-service
    scenario: month-end-processing
spec:
  selector:
    app: inventory-service
    scenario: month-end-processing
  ports:
  - port: 8080
    targetPort: 8080
    name: api
