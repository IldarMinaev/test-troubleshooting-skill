apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-parallel-import
  labels:
    app: inventory-service
    scenario: parallel-import
data:
  MODE: "batch"
  BATCH_JOBS: "parallel-import"
  PROCESSING_LOAD: "high"
  JOB_DURATION: "1800"           # 30 minutes
  WARMUP_PERIOD: "0"
  GRACEFUL_SHUTDOWN: "true"
  MANAGEMENT_API_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-parallel-import
  labels:
    app: inventory-service
    scenario: parallel-import
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
      scenario: parallel-import
  template:
    metadata:
      labels:
        app: inventory-service
        scenario: parallel-import
    spec:
      containers:
      - name: batch-worker
        image: inventory-service:latest
        imagePullPolicy: IfNotPresent
        env:
        # DBAAS connection (replace with your values or use envFrom with existing secret)
        - name: DBAAS_URL
          value: "http://dbaas-aggregator:8080"
        - name: DBAAS_USER
          value: "dba_client"
        - name: DBAAS_PASSWORD
          value: "your-password-here"
        - name: APP_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Batch job configuration
        - name: MODE
          valueFrom:
            configMapKeyRef:
              name: inventory-parallel-import
              key: MODE
        - name: BATCH_JOBS
          valueFrom:
            configMapKeyRef:
              name: inventory-parallel-import
              key: BATCH_JOBS
        - name: PROCESSING_LOAD
          valueFrom:
            configMapKeyRef:
              name: inventory-parallel-import
              key: PROCESSING_LOAD
        - name: JOB_DURATION
          valueFrom:
            configMapKeyRef:
              name: inventory-parallel-import
              key: JOB_DURATION
        - name: WARMUP_PERIOD
          valueFrom:
            configMapKeyRef:
              name: inventory-parallel-import
              key: WARMUP_PERIOD
        - name: GRACEFUL_SHUTDOWN
          valueFrom:
            configMapKeyRef:
              name: inventory-parallel-import
              key: GRACEFUL_SHUTDOWN
        - name: MANAGEMENT_API_ENABLED
          valueFrom:
            configMapKeyRef:
              name: inventory-parallel-import
              key: MANAGEMENT_API_ENABLED
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 8080
          name: api
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-parallel-import
  labels:
    app: inventory-service
    scenario: parallel-import
spec:
  selector:
    app: inventory-service
    scenario: parallel-import
  ports:
  - port: 8080
    targetPort: 8080
    name: api
