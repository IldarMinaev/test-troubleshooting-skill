name: common-troubleshooting-skills
version: 1.0.0
description: Common troubleshooting methodology and shared references for Kubernetes-managed databases
author: Qubership
license: Apache-2.0
type: skill

dependencies:
  apm: []
  mcp: []
scripts: {}


# All skills share _common/ reference docs.
# Install the full package to ensure shared resources are deployed
# alongside individual skills:
#
#   apm install <org>/<repo>
#
# Individual skills can also be installed, but require co-installing
# the shared resource package:
#
#   apm install <org>/<repo>/skills/common-troubleshooting
#   apm install <org>/<repo>/skills/_common

compilation:
  target: all
  strategy: distributed
  resolve_links: true
  source_attribution: true
